</head>

        <div class="menu-items">

                        <span class="link-name">Inicio</span>
                    </a>
                </li>
                <li>
                    <a href="pacientes.html" class="menu-link">
                        <i><img src="../Images/dueno-de-una-mascota.png" class="user-icon"></i>
                        <span class="link-name">Pacientes</span>
                    </a>
                </li>
                <li>
                    <a href="agenda.html" class="menu-link">
                        <i><img src="../Images/agenda.png" class="user-icon"></i>
                        <span class="link-name">Agenda</span>
                    </a>
                </li>
                <li>
                    <a href="inventario.html" class="menu-link">
                        <i><img src="../Images/inventario.svg" class="user-icon"></i>

                    <a href="proveedores.html" class="menu-link">

                <li>

                <li>

    <!-- Inicio contenido principal -->
    <section class="dashboard">
        <div class="top">
            <i class="uil uil-bars sidebar-toggle"></i>
            <div id="usernameDisplay">
                <img src="../Images/sesion.png" />
            </div>
        </div>
        <div class="dash-content">
            <div class="activity">
                <div class="title">
                    <img src="../Images/sesion.png" alt="Usuarios" class="user-icon">
                    <span class="text">USUARIOS</span>
                </div>

                <!-- Filter Row -->
                <div class="filter-row">
                    <select class="form-control" id="filtroRol">
                        <option value="">Todos los roles</option>
                    </select>
                    <select class="form-control" id="filtroEstado">
                        <option value="">Todos los estados</option>
                        <option value="true">Activo</option>
                        <option value="false">Inactivo</option>
                    </select>
                    <button type="button" class="btn btn-success" data-toggle="modal"
                        data-target="#modalUsuario" id="btnNuevoUsuario">
                        Nuevo Usuario
                    </button>
                </div>

                <!-- Users Table -->
                <div class="table-container">
                    <table class="table table-sm table-striped table-hover align-middle mb-0">
                        <thead class="text-center">
                            <tr>
                                <th>Nombre Completo</th>
                                <th>Documento</th>
                                <th>Email</th>
                                <th>Username</th>
                                <th>Rol</th>
                                <th>Estado</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tablaUsuarios">
                            <tr>
                                <td colspan="7" class="text-center text-muted">
                                    Cargando usuarios...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <!-- ============================================ -->
                <!-- Modal: Registro/Edición de Usuario -->
                <!-- ============================================ -->
                <div class="modal fade" id="modalUsuario" tabindex="-1" aria-labelledby="modalUsuarioLabel"
                    aria-hidden="true">
                    <div class="modal-dialog modal-lg" role="document">
                        <div class="modal-content">
                            <div class="modal-header bg-success text-white">
                                <h5 class="modal-title" id="modalUsuarioLabel">Registro de Usuario</h5>
                                <button type="button" class="close text-white" data-dismiss="modal">
                                    &times;
                                </button>
                            </div>
                            <form id="formUsuario">
                                <div class="modal-body">
                                    <input type="hidden" id="pv_documento_edit">
                                    <div class="row">
                                        <div class="col-md-6">
                                            <div class="form-group">
                                                <label>Primer Nombre *</label>
                                                <input type="text" class="form-control" id="pv_primer_nombre" required>
                                            </div>
                                        </div>
                                        <div class="col-md-6">
                                            <div class="form-group">
                                                <label>Segundo Nombre</label>
                                                <input type="text" class="form-control" id="pv_segundo_nombre">
                                            </div>
                                        </div>
                                    </div>
                                    <div class="row">
                                        <div class="col-md-6">
                                            <div class="form-group">
                                                <label>Primer Apellido *</label>
                                                <input type="text" class="form-control" id="pv_primer_apellido" required>
                                            </div>
                                        </div>
                                        <div class="col-md-6">
                                            <div class="form-group">
                                                <label>Segundo Apellido</label>
                                                <input type="text" class="form-control" id="pv_segundo_apellido">
                                            </div>
                                        </div>
                                    </div>
                                    <div class="row">
                                        <div class="col-md-4">
                                            <div class="form-group">
                                                <label>Tipo Documento *</label>
                                                <select class="form-control" id="pv_td_id_t_documento" required>
                                                    <option value="">Seleccione</option>
                                                    <option value="1">Cédula de Ciudadanía</option>
                                                    <option value="2">Cédula de Extranjería</option>
                                                    <option value="3">Pasaporte</option>
                                                    <option value="4">Tarjeta de Identidad</option>
                                                </select>
                                            </div>
                                        </div>
                                        <div class="col-md-4">
                                            <div class="form-group">
                                                <label>Documento *</label>
                                                <input type="number" class="form-control" id="pv_documento" required>
                                            </div>
                                        </div>
                                        <div class="col-md-4">
                                            <div class="form-group">
                                                <label>Género *</label>
                                                <select class="form-control" id="pv_g_id_genero" required>
                                                    <option value="">Seleccione</option>
                                                    <option value="1">Femenino</option>
                                                    <option value="2">Masculino</option>
                                                    <option value="3">No informa</option>
                                                </select>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="row">
                                        <div class="col-md-6">
                                            <div class="form-group">
                                                <label>Email *</label>
                                                <input type="email" class="form-control" id="pv_email" required>
                                            </div>
                                        </div>
                                        <div class="col-md-6">
                                            <div class="form-group">
                                                <label>Username *</label>
                                                <input type="text" class="form-control" id="pv_username" required>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="row">
                                        <div class="col-md-6">
                                            <div class="form-group">
                                                <label>Teléfono</label>
                                                <input type="text" class="form-control" id="ic_telefono">
                                            </div>
                                        </div>
                                        <div class="col-md-6">
                                            <div class="form-group">
                                                <label>Dirección</label>
                                                <input type="text" class="form-control" id="ic_direccion">
                                            </div>
                                        </div>
                                    </div>
                                    <!-- Password fields (only for create mode) -->
                                    <div id="camposContrasena">
                                        <div class="row">
                                            <div class="col-md-6">
                                                <div class="form-group">
                                                    <label>Contraseña *</label>
                                                    <input type="password" class="form-control" id="usr_contrasena">
                                                </div>
                                            </div>
                                            <div class="col-md-6">
                                                <div class="form-group">
                                                    <label>Confirmar Contraseña *</label>
                                                    <input type="password" class="form-control" id="usr_confirmar_contrasena">
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="row">
                                        <div class="col-md-6">
                                            <div class="form-group">
                                                <label>Rol *</label>
                                                <select class="form-control" id="usr_rol" required>
                                                    <option value="">Seleccione</option>
                                                </select>
                                            </div>
                                        </div>
                                        <div class="col-md-6">
                                            <div class="form-group">
                                                <label>Estado</label>
                                                <div class="form-check mt-2">
                                                    <input type="checkbox" class="form-check-input" id="usr_estado" checked>
                                                    <label class="form-check-label" for="usr_estado">Activo</label>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div class="modal-footer">
                                    <button type="button" class="btn btn-secondary btn-sm" data-dismiss="modal">
                                        Cancelar
                                    </button>
                                    <button type="submit" id="btnGuardarUsuario" class="btn btn-success btn-sm">
                                        Guardar
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </section>
    <!-- Fin contenido principal -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

        crossorigin="anonymous"></script>
    <script src="../js/auth-guard.js"></script>
    <script src="../js/script.js"></script>
    <script src="../js/usuarios.js"></script>
    <link rel="stylesheet" href="../css/loader.css">
    <script src="../js/loader.js"></script>
</body>

</html>
