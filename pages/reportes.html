<!DOCTYPE html>
<html lang="en">

<head>
    <title>PetCare System</title>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="">
    <meta name="author" content="">
    <link href="https://unicons.iconscout.com/release/v4.0.0/css/line.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css"
        integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
    <link href="../css/inventario.css" rel="stylesheet">
</head>

<!-- Inicio menu de navegacion lateral -->

<body>
    <nav>
        <div class="logo-name">
            <div class="logo-image">
                <img src="../Images/logo.png" alt="">
            </div>
            <span class="logo_name">PetCare</span>
        </div>
        <div class="menu-items">
            <ul class="nav-links">
                <li>
                    <a href="home.html" class="menu-link">
                        <i><img src="../Images/inicio.png" class="user-icon"></i>
                        <span class="link-name">Inicio</span>
                    </a>
                </li>
                <li>
                    <a href="pacientes.html" class="menu-link">
                        <i><img src="../Images/dueno-de-una-mascota.png" class="user-icon"></i>
                        <span class="link-name">Pacientes</span>
                    </a>
                </li>
                <li>
                    <a href="agenda.html" class="menu-link">
                        <i><img src="../Images/agenda.png" class="user-icon"></i>
                        <span class="link-name">Agenda</span>
                    </a>
                </li>
                <li>
                    <a href="inventario.html" class="menu-link">
                        <i><img src="../Images/inventario.svg" class="user-icon"></i>
                        <span class="link-name">Inventario</span>
                    </a>
                </li>
                <li>
                    <a href="proveedores.html" class="menu-link">
                        <i><img src="../Images/proveedores.svg" class="user-icon"></i>
                        <span class="link-name">Proveedores</span>
                    </a>
                </li>
                <li>
                    <a href="compras.html" class="menu-link">
                        <i><img src="../Images/compras.svg" class="user-icon"></i>
                        <span class="link-name">Compras</span>
                    </a>
                </li>
                <li>
                    <a href="ventas.html" class="menu-link">
                        <i><img src="../Images/ventas.svg" class="user-icon"></i>
                        <span class="link-name">Ventas</span>
                    </a>
                </li>
                <li>
                    <a href="reportes.html" class="menu-link">
                        <i><img src="../Images/reportes.svg" class="user-icon"></i>
                        <span class="link-name">Reportes</span>
                    </a>
                </li>
            </ul>
            <ul class="logout-mode">
                <li><a onclick="cerrarSesion()">
                        <i><img src="../Images/cerrar-sesion.png" alt="Usuario" class="user-icon"></i>
                        <span class="link-name">Logout</span>
                    </a></li>
            </ul>
        </div>
    </nav>
    <!-- Fin menu de navegacion lateral -->

    <!-- Inicio contenido principal -->
    <section class="dashboard">
        <div class="top">
            <i class="uil uil-bars sidebar-toggle"></i>
            <div id="usernameDisplay">
                <img src="../Images/sesion.png" />
            </div>
        </div>
        <div class="dash-content">
            <div class="activity">
                <div class="title">
                    <img src="../Images/reportes.svg" alt="Reportes" class="user-icon">
                    <span class="text">REPORTES</span>
                </div>

                <!-- Report Filters -->
                <div class="filter-row">
                    <select class="form-control" id="tipoReporte">
                        <option value="mas_vendidos">Más vendidos</option>
                        <option value="baja_rotacion">Baja rotación</option>
                        <option value="utilidad">Utilidad</option>
                        <option value="inventario_valorizado">Inventario valorizado</option>
                    </select>

                    <label class="mb-0 ml-2" for="fechaInicio">Desde:</label>
                    <input type="date" class="form-control" id="fechaInicio">

                    <label class="mb-0 ml-2" for="fechaFin">Hasta:</label>
                    <input type="date" class="form-control" id="fechaFin">

                    <select class="form-control" id="filtroCategoria" style="display: none;">
                        <option value="">Todas las categorías</option>
                    </select>

                    <button type="button" class="btn btn-success" id="btnGenerarReporte">
                        Generar Reporte
                    </button>
                    <button type="button" class="btn btn-secondary" id="btnImprimir">
                        Imprimir
                    </button>
                </div>

                <!-- Results Area -->
                <div class="table-container" id="resultadosReporte">
                    <table class="table table-sm table-striped table-hover align-middle mb-0">
                        <thead class="text-center" id="tablaReporteHead">
                            <tr>
                                <th colspan="5">Seleccione un tipo de reporte y haga clic en "Generar Reporte"</th>
                            </tr>
                        </thead>
                        <tbody id="tablaReporteBody">
                            <tr>
                                <td colspan="5" class="text-center text-muted">
                                    Sin datos para mostrar
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

            </div>
        </div>
    </section>
    <!-- Fin contenido principal -->

    <!-- Import librerias JS -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://code.jquery.com/jquery-3.6.3.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/js/bootstrap.min.js"
        integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl"
        crossorigin="anonymous"></script>
    <script src="../js/auth-guard.js"></script>
    <script src="../js/script.js"></script>
    <script src="../js/reportes.js"></script>
    <link rel="stylesheet" href="../css/loader.css">
    <script src="../js/loader.js"></script>
</body>

</html>
